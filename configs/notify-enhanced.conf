# Enhanced Fail2Ban notification action configuration
# Place this file in /etc/fail2ban/action.d/notify-enhanced.conf
# This version provides more configuration options and features

[INCLUDES]

before = iptables-common.conf

[Definition]

# Option: actionstart
# Notes.: command executed once at the start of Fail2Ban.
# Values: CMD
actionstart =

# Option: actionstop
# Notes.: command executed at the stop of jail (or at the end of Fail2Ban)
# Values: CMD
actionstop =

# Option: actioncheck
# Notes.: command executed once before each actionban command
# Values: CMD
actioncheck =

# Option: actionban
# Notes.: command executed when banning an IP. Take care that the
#         command is executed with Fail2Ban user rights.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values: CMD
actionban = timeout <timeout> /usr/local/bin/fail2ban-notify -ip="<ip>" -jail="<name>" -action="ban" -failures="<failures>" -config="<config_path>"<debug_flag><extra_args>

# Option: actionunban
# Notes.: command executed when unbanning an IP. Take care that the
#         command is executed with Fail2Ban user rights.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values: CMD
actionunban = timeout <timeout> /usr/local/bin/fail2ban-notify -ip="<ip>" -jail="<name>" -action="unban" -failures="<failures>" -config="<config_path>"<debug_flag><extra_args>

# Option: actionflush
# Notes.: command executed once to flush (clear) all bans
# Values: CMD
actionflush =

[Init]

# Default name of the jail
name = default

# Option: timeout
# Notes.: specifies timeout value for the notification command
# Values: [ NUM ]  Default: 60
timeout = 60

# Option: config_path
# Notes.: path to the fail2ban-notify configuration file
# Values: [ STRING ]  Default: /etc/fail2ban/fail2ban-notify.json
config_path = /etc/fail2ban/fail2ban-notify.json

# Option: debug_flag
# Notes.: set to " -debug" to enable debug mode (note the leading space)
# Values: [ STRING ]  Default: (empty - no debug)
debug_flag =

# Option: notify_start_stop
# Notes: send notifications when jail starts/stops (not yet implemented)
# Values: [ true | false ]  Default: false
notify_start_stop = false

# Option: notify_flush
# Notes.: send notifications when jail is flushed (not yet implemented)
# Values: [ true | false ]  Default: false
notify_flush = false

# Option: min_failures
# Notes.: minimum number of failures before sending notification (not yet implemented)
# Values: [ NUM ]  Default: 1
min_failures = 1

# Option: notify_local_ips
# Notes.: send notifications for local/private IP addresses (not yet implemented)
# Values: [ true | false ]  Default: false
notify_local_ips = false

# Option: extra_data
# Notes.: additional data to pass to the notification system (leave empty if not needed)
# Values: [ STRING ]  Default: (empty)
extra_data =

# Computed value - adds -extra="value" only if extra_data is set
extra_args = <extra_data? -extra="<extra_data>">

# Example usage configurations:

# Basic usage (same as notify.conf):
# [your-jail]
# action = iptables[name=SSH, port=ssh, protocol=tcp]
#          notify-enhanced

# Advanced usage with debug enabled:
# [ssh-advanced]
# action = iptables[name=SSH, port=ssh, protocol=tcp]
#          notify-enhanced[debug_flag=" -debug"]

# Custom config file location:
# [ssh-custom]
# action = iptables[name=SSH, port=ssh, protocol=tcp]
#          notify-enhanced[config_path=/opt/fail2ban/custom-notify.json]

# Include additional data:
# [ssh-with-data]
# action = iptables[name=SSH, port=ssh, protocol=tcp]
#          notify-enhanced[extra_data="server=web01,env=production"]
